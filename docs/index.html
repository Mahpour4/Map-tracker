<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Tracker Viewer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-container">
    <div class="login-box">
      <h1>Map Tracker</h1>
      <p>Enter your PIN to continue</p>
      <input type="password" id="pin-input" class="pin-input" placeholder="PIN" maxlength="10"
             inputmode="numeric" autocomplete="off">
      <button id="login-btn" class="login-btn">Sign In</button>
      <div id="login-error" class="login-error">Invalid PIN. Please try again.</div>
    </div>
  </div>

  <!-- Dashboard (shown after login) -->
  <div id="dashboard-screen" style="display:none;">
    <div class="dashboard">
      <h2 id="welcome-msg">Welcome</h2>
      <div class="dash-grid" id="dash-grid"></div>
      <div style="text-align:center; margin-top:32px;">
        <button onclick="logout()" class="nav-logout" style="padding:8px 24px; font-size:14px;">
          Logout
        </button>
      </div>
    </div>
  </div>

  <script src="js/users.js"></script>
  <script src="js/shared.js"></script>
  <script>
    const pageInfo = {
      orders:    { icon: "📦", label: "Orders",    desc: "Warehouse orders & invoices" },
      inventory: { icon: "📊", label: "Inventory", desc: "Stock levels & deliveries" },
      schedule:  { icon: "📅", label: "Schedule",  desc: "Weekly route schedules" },
      visits:    { icon: "🏪", label: "Visits",    desc: "Store visit history & grades" },
      map:       { icon: "🗺️", label: "Map",       desc: "Store locations & routes" },
    };

    // Check if already logged in
    const session = getSession();
    if (session) {
      showDashboard(session);
    }

    // Login handler
    document.getElementById("login-btn").addEventListener("click", doLogin);
    document.getElementById("pin-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });

    async function doLogin() {
      const pin = document.getElementById("pin-input").value.trim();
      if (!pin) return;
      const user = await authenticate(pin);
      if (user) {
        showDashboard({ name: user.name, pages: user.pages });
      } else {
        const err = document.getElementById("login-error");
        err.style.display = "block";
        document.getElementById("pin-input").value = "";
        document.getElementById("pin-input").focus();
        setTimeout(() => { err.style.display = "none"; }, 3000);
      }
    }

    function showDashboard(session) {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("dashboard-screen").style.display = "block";
      document.getElementById("welcome-msg").textContent = `Welcome, ${session.name}`;
      const grid = document.getElementById("dash-grid");
      grid.innerHTML = "";
      session.pages.forEach(pageId => {
        const info = pageInfo[pageId];
        if (!info) return;
        grid.innerHTML += `
          <a href="${pageId}.html" class="dash-card">
            <div class="icon">${info.icon}</div>
            <div class="label">${info.label}</div>
            <div class="desc">${info.desc}</div>
          </a>`;
      });
    }
  </script>
</body>
</html>
