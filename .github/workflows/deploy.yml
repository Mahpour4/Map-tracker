name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - claude/map-stores-zones-zcvTK

jobs:
  deploy:
    name: SSH deploy & restart bot
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 129.159.177.50
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/Map-tracker
            git pull origin claude/map-stores-zones-zcvTK
            pm2 restart whatsapp-bot
            echo "✅ Deploy complete — $(date)"
