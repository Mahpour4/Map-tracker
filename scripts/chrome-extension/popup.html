<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #f8fafc;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
      color: #1e293b;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 14px;
    }
    .site-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .site-dao {
      background: #dbeafe;
      color: #1e40af;
    }
    .site-websnak {
      background: #dcfce7;
      color: #166534;
    }
    .site-unknown {
      background: #fef3c7;
      color: #92400e;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-dao {
      background: #3b82f6;
      color: #fff;
    }
    .btn-websnak {
      background: #22c55e;
      color: #fff;
    }
    .status {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }
    .status.show { display: block; }
    .status.info { background: #eff6ff; color: #1e40af; }
    .status.success { background: #f0fdf4; color: #166534; }
    .status.error { background: #fef2f2; color: #991b1b; }
    .unknown-msg {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Map Tracker Importer</h1>
  <p class="subtitle">Import data into Map Tracker</p>

  <div id="content"></div>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
