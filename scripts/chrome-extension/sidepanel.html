<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 12px 20px 14px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
    }
    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .header .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }

    /* Site detection card */
    .site-card {
      margin: 16px 20px 0;
      padding: 16px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .site-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .site-dao { background: #dbeafe; color: #1e40af; }
    .site-websnak { background: #dcfce7; color: #166534; }
    .site-unknown { background: #fef3c7; color: #92400e; }

    .site-url {
      margin-top: 8px;
      font-size: 11px;
      color: #94a3b8;
      word-break: break-all;
      line-height: 1.4;
    }

    /* Import button */
    .btn {
      display: block;
      width: calc(100% - 40px);
      margin: 16px 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.2px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-dao { background: #3b82f6; color: #fff; }
    .btn-websnak { background: #22c55e; color: #fff; }
    .btn-download { background: #f59e0b; color: #fff; margin-top: 0; }
    .btn-invoices { background: #8b5cf6; color: #fff; margin-top: 0; }
    .btn-stop { background: #ef4444; color: #fff; margin-top: 0; }
    .btn-cb-inquiry { background: #0891b2; color: #fff; }

    /* Tabs */
    .mode-toggle {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin: 12px 0 0;
      gap: 0;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 14px;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: transparent;
      color: #94a3b8;
      white-space: nowrap;
    }
    .mode-btn:hover { color: #334155; background: #f8fafc; }
    .mode-btn.active.mode-dao     { color: #3b82f6; border-bottom-color: #3b82f6; background: transparent; }
    .mode-btn.active.mode-cb      { color: #0891b2; border-bottom-color: #0891b2; background: transparent; }
    .mode-btn.active.mode-websnak { color: #16a34a; border-bottom-color: #16a34a; background: transparent; }
    /* Tab panel */
    .tab-panel {
      margin: 16px 20px 0;
      padding: 14px 16px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .tab-panel-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    /* Status log */
    .log-section {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px;
    }
    .log-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin: 16px 0 8px;
    }
    .log-entry {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 6px;
      border-left: 3px solid transparent;
    }
    .log-entry.info {
      background: #eff6ff;
      color: #1e40af;
      border-left-color: #3b82f6;
    }
    .log-entry.success {
      background: #f0fdf4;
      color: #166534;
      border-left-color: #22c55e;
    }
    .log-entry.error {
      background: #fef2f2;
      color: #991b1b;
      border-left-color: #ef4444;
    }
    .log-time {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Unknown site message */
    .unknown-msg {
      margin: 16px 20px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
    }
    .unknown-msg strong { color: #1e293b; }

    /* Empty state */
    .empty-log {
      text-align: center;
      color: #cbd5e1;
      font-size: 12px;
      margin-top: 24px;
    }

    /* Clear button */
    .btn-clear {
      background: none;
      border: 1px solid #e2e8f0;
      color: #94a3b8;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-clear:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0 8px;
    }

    /* Route picker */
    #routePicker {
      margin: 0 20px;
      padding: 16px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .route-header {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 10px;
    }
    .route-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .route-btn {
      padding: 8px 4px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      text-align: center;
      line-height: 1.3;
      transition: all 0.15s;
    }
    .route-btn:hover {
      background: #ede9fe;
      border-color: #8b5cf6;
      color: #6d28d9;
    }
    .route-btn.route-all {
      background: #8b5cf6;
      color: #fff;
      border-color: #8b5cf6;
    }
    .route-btn.route-all:hover {
      background: #7c3aed;
    }
    .route-btn.route-current {
      background: #f1f5f9;
      color: #64748b;
      border-color: #cbd5e1;
    }
    .route-btn.route-current:hover {
      background: #e2e8f0;
      color: #334155;
    }
    .route-count {
      font-size: 10px;
      font-weight: 400;
      opacity: 0.8;
    }
    .route-cancel {
      display: block;
      width: 100%;
      padding: 8px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: none;
      color: #94a3b8;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .route-cancel:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }
    .route-loading {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 12px 0;
    }
    .route-error {
      text-align: center;
      color: #991b1b;
      font-size: 12px;
      padding: 12px 0;
      background: #fef2f2;
      border-radius: 6px;
    }

    /* Page limit row */
    .page-limit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 20px 12px;
      font-size: 12px;
      color: #64748b;
    }
    .page-limit-label { font-weight: 600; white-space: nowrap; }
    .page-limit-select {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
      color: #334155;
      cursor: pointer;
    }
    .page-limit-hint { font-size: 11px; color: #94a3b8; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h1>Map Tracker Importer</h1>
      <span class="subtitle">v2.56.9</span>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn mode-dao active" data-mode="dao">DAO Import</button>
      <button class="mode-btn mode-cb" data-mode="cb">CB Inquiry</button>
      <button class="mode-btn mode-websnak" data-mode="websnak">WebSnak</button>
    </div>
  </div>

  <div id="button-area"></div>

  <div class="log-section">
    <div class="log-header">
      <div class="log-title">Activity Log</div>
      <button id="clearBtn" class="btn-clear">Clear</button>
    </div>
    <div id="log"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
