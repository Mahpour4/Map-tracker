<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 16px 20px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 2px;
    }
    .header .subtitle {
      font-size: 12px;
      color: #94a3b8;
    }

    /* Site detection card */
    .site-card {
      margin: 16px 20px 0;
      padding: 16px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .site-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .site-dao { background: #dbeafe; color: #1e40af; }
    .site-websnak { background: #dcfce7; color: #166534; }
    .site-unknown { background: #fef3c7; color: #92400e; }

    .site-url {
      margin-top: 8px;
      font-size: 11px;
      color: #94a3b8;
      word-break: break-all;
      line-height: 1.4;
    }

    /* Import button */
    .btn {
      display: block;
      width: calc(100% - 40px);
      margin: 16px 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.2px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-dao { background: #3b82f6; color: #fff; }
    .btn-websnak { background: #22c55e; color: #fff; }

    /* Status log */
    .log-section {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px;
    }
    .log-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin: 16px 0 8px;
    }
    .log-entry {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 6px;
      border-left: 3px solid transparent;
    }
    .log-entry.info {
      background: #eff6ff;
      color: #1e40af;
      border-left-color: #3b82f6;
    }
    .log-entry.success {
      background: #f0fdf4;
      color: #166534;
      border-left-color: #22c55e;
    }
    .log-entry.error {
      background: #fef2f2;
      color: #991b1b;
      border-left-color: #ef4444;
    }
    .log-time {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Unknown site message */
    .unknown-msg {
      margin: 16px 20px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
    }
    .unknown-msg strong { color: #1e293b; }

    /* Empty state */
    .empty-log {
      text-align: center;
      color: #cbd5e1;
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Map Tracker Importer</h1>
    <p class="subtitle">Import data into Map Tracker</p>
  </div>

  <div id="content"></div>
  <div id="button-area"></div>

  <div class="log-section">
    <div class="log-title">Activity Log</div>
    <div id="log"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
